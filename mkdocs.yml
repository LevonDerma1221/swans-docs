site_name: SWANS Event Exchange — Documentation
site_description: Internal technical specification for the SWANS event exchange
repo_url: https://github.com/LevonDerma1221/swans-docs
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  features: [navigation.sections, navigation.expand, content.code.copy, toc.integrate]
  icon:
    edit: material/pencil
markdown_extensions:
  - tables
  - admonition
  - toc
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - SWANS Overview:
      - Overview: index.md
      - Diagrams: diagrams.md
      - Architecture: clients/architecture.md
      - Onboarding: clients/onboarding.md
      - Contracts: clients/contracts.md
      - Schemas and contract engine: clients/schemas.md
      - Trading rules: clients/trading-rules.md
      - Clearing and collateral: clients/clearing.md
      - Margin: clients/margin.md
      - Fees: clients/fees.md
      - Settlement: clients/settlement.md
      - Market data: clients/market-data.md
  - System design:
      - Architecture: internal/architecture.md
      - Data model: internal/data-model.md
      - Messaging: internal/messaging.md
  - Specs:
      - Reference data: internal/services/refdata.md
      - Contract engine: internal/services/contract-engine.md
      - FIX gateway: internal/services/gateway.md
      - Pre-trade risk: internal/services/pretrade.md
      - Matching engine: internal/services/engine.md
      - Trades: internal/services/trades.md
      - Positions: internal/services/positions.md
      - Collateral: internal/services/collateral.md
      - Marks: internal/services/marks.md
      - Market data publisher: internal/services/mdpub.md
      - Settlement: internal/services/settlement.md
      - Risk engine: internal/services/riskengine.md
      - Margin: internal/services/margin.md
      - Risk library: internal/risk-library.md
      - Reporting: internal/services/reporting.md
  - Plan & decisions:
      - Roadmap: internal/build-plan.md
      - Governance: internal/governance.md
      - Open questions: internal/open-decisions.md
      - "Reference: margin & liquidation architecture": internal/margin-architecture-reference.md
